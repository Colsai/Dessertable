{% extends "base.html" %}

{% block title %}Admin Login - DessertAble{% endblock %}

{% block content %}
<div class="search-container" style="max-width: 500px; margin: 5rem auto;">
    <h1 style="font-weight: 700; font-size: 2.5rem; margin-bottom: 2rem; color: #000; letter-spacing: -1px; text-align: center;">
        Admin Access
    </h1>

    <form method="POST" action="{{ url_for('main.admin_login') }}">
        <div class="mb-4">
            <label for="password" class="form-label" style="font-size: 0.9rem; color: #666;">Admin Password</label>
            <input type="password"
                   class="form-control form-control-lg"
                   id="password"
                   name="password"
                   required
                   placeholder="Enter admin password"
                   autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
            Access Dashboard
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{{ url_for('main.index') }}" style="color: #999; font-size: 0.85rem; text-decoration: none;">
            ← Back to home
        </a>
    </div>
</div>
{% endblock %}
