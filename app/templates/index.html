{% extends "base.html" %}

{% block title %}Dessertable{% endblock %}

{% block content %}
<div class="search-container" style="max-width: 600px; margin: 5rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <img src="{{ url_for('static', filename='sprites/sprite_03.png') }}" class="page-sprite" alt="">
    </div>
    <h1 style="font-weight: 700; font-size: 3rem; margin-bottom: 3rem; color: #000; letter-spacing: -1px; line-height: 1.1; text-align: center;">
        Find dessert near you
    </h1>

    <form method="POST" action="{{ url_for('main.search') }}">
        <div class="mb-4">
            <input type="text"
                   class="form-control form-control-lg"
                   name="address"
                   required
                   placeholder="Enter your address"
                   autocomplete="street-address">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
            Search
        </button>
    </form>
</div>
{% endblock %}
