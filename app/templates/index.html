{% extends "base.html" %}

{% block title %}5-to-Dine{% endblock %}

{% block content %}
<div class="search-container" style="max-width: 600px; margin: 5rem auto;">
    <h1 style="font-weight: 700; font-size: 3rem; margin-bottom: 3rem; color: #000; letter-spacing: -1px; line-height: 1.1;">
        Find dessert near you
    </h1>

    <form method="POST" action="{{ url_for('main.search') }}">
        <div class="mb-4">
            <input type="text"
                   class="form-control form-control-lg"
                   name="address"
                   required
                   placeholder="Enter your address"
                   autocomplete="street-address">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
            Search
        </button>
    </form>
</div>
{% endblock %}
