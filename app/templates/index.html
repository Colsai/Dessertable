{% extends "base.html" %}

{% block title %}DessertAble{% endblock %}

{% block content %}
<div class="home-collage-wrapper">

    <!-- Decorative paper collage blocks -->
    <div class="collage-block collage-tan-tl"      aria-hidden="true"></div>
    <div class="collage-block collage-dark-tr"     aria-hidden="true"></div>
    <div class="collage-block collage-dark-bl"     aria-hidden="true"></div>
    <div class="collage-block collage-tan-br"      aria-hidden="true"></div>
    <div class="collage-block collage-dark-shadow" aria-hidden="true"></div>

    <!-- Center floating card -->
    <div class="home-card">

        <p class="home-go-text">Go</p>

        <form method="POST" action="{{ url_for('main.search') }}"
              id="searchForm"
              style="width:100%; display:flex; flex-direction:column; align-items:center; gap:0.75rem;">
            <div class="search-input-wrapper" style="width:100%; max-width:300px;">
                <input type="text"
                       class="form-control form-control-lg"
                       id="addressInput"
                       name="address"
                       required
                       placeholder="Enter your address"
                       autocomplete="street-address">
                <button type="button" class="input-clear-btn" id="clearBtn" aria-label="Clear address">×</button>
            </div>
            <button type="submit" class="home-play-btn" id="searchBtn" aria-label="Search">▶</button>
        </form>

        <div id="loadingMessage" style="display:none; margin-top:1rem; text-align:center;">
            <p>finding your desserts<span id="loadingDots"></span></p>
        </div>

    </div><!-- /.home-card -->

</div><!-- /.home-collage-wrapper -->

<script>
var addressInput = document.getElementById('addressInput');
var clearBtn     = document.getElementById('clearBtn');

// Clear button
addressInput.addEventListener('input', function () {
    clearBtn.style.display = this.value ? 'block' : 'none';
});
clearBtn.addEventListener('click', function () {
    addressInput.value = '';
    clearBtn.style.display = 'none';
    addressInput.focus();
});

// Loading state on submit
document.getElementById('searchForm').addEventListener('submit', function () {
    var btn = document.getElementById('searchBtn');
    btn.disabled = true;
    document.getElementById('loadingMessage').style.display = 'block';
    var dots = ['', '.', '..', '...'];
    var i = 0;
    setInterval(function () {
        i = (i + 1) % dots.length;
        document.getElementById('loadingDots').textContent = dots[i];
    }, 400);
});
</script>
{% endblock %}
