{% extends "base.html" %}

{% block title %}Login - DessertAble{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px; margin: 5rem auto;">
    <h1 style="text-align: center; margin-bottom: 3rem;">
        Log in
    </h1>

    <form method="POST" action="{{ url_for('main.login') }}">
        <div class="mb-4">
            <input type="text"
                   class="form-control form-control-lg"
                   name="username"
                   required
                   placeholder="Username"
                   autocomplete="username"
                   >
        </div>

        <div class="mb-4">
            <input type="password"
                   class="form-control form-control-lg"
                   name="password"
                   required
                   placeholder="Password"
                   autocomplete="current-password"
                   >
        </div>

        <div class="mb-4" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" name="remember" id="remember" value="true" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="remember" style="margin: 0; cursor: pointer; color: #666; font-size: 0.95rem;">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
            Log in
        </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; color: #666; font-size: 1rem;">
        Don't have an account?
        <a href="{{ url_for('main.register') }}" style="color: #224680; text-decoration: none; font-weight: 500;">
            Sign up
        </a>
    </div>
</div>
{% endblock %}
