{% extends "base.html" %}

{% block title %}Register - DessertAble{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px; margin: 5rem auto;">
    <h1 style="font-weight: 700; font-size: 2.5rem; margin-bottom: 3rem; color: #000; letter-spacing: -1px; text-align: center;">
        Create account
    </h1>

    <form method="POST" action="{{ url_for('main.register') }}">
        <!-- Invite Code Field -->
        <div class="mb-4">
            <input type="text"
                   class="form-control form-control-lg"
                   name="invite_code"
                   required
                   placeholder="Invite code (required)"
                   autocomplete="off"
                   style="font-size: 1.1rem;">
        </div>

        <div class="mb-4">
            <input type="text"
                   class="form-control form-control-lg"
                   name="username"
                   required
                   minlength="3"
                   placeholder="Username (min 3 characters)"
                   autocomplete="username"
                   style="font-size: 1.1rem;">
        </div>

        <div class="mb-4">
            <input type="password"
                   class="form-control form-control-lg"
                   name="password"
                   required
                   minlength="6"
                   placeholder="Password (min 6 characters)"
                   autocomplete="new-password"
                   style="font-size: 1.1rem;">
        </div>

        <div class="mb-4">
            <input type="password"
                   class="form-control form-control-lg"
                   name="confirm_password"
                   required
                   minlength="6"
                   placeholder="Confirm password"
                   autocomplete="new-password"
                   style="font-size: 1.1rem;">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg" style="font-size: 1.1rem; font-weight: 600; padding: 1rem;">
            Create account
        </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; color: #666; font-size: 1rem;">
        Already have an account?
        <a href="{{ url_for('main.login') }}" style="color: #224680; text-decoration: none; font-weight: 500;">
            Log in
        </a>
    </div>
</div>
{% endblock %}
