services:
  - type: web
    name: dessertable
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dessertable-db
          property: connectionString

databases:
  - name: dessertable-db
    databaseName: dessertable
    plan: free
    user: dessertable
